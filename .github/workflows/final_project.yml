name: First Workflow
on:
  push:
    branches:
      - main
jobs:
  run_first_command_text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Display some text
        run: echo Hello, Github Actions!
  date:
    runs-on: ubuntu-latest
    steps:
      - name: Show current date
        run: date 
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show files
        run: ls -la
     
